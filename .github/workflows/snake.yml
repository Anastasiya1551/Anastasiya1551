name: snake
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
jobs:
  snake:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Anastasiya1551
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#4493F8&color_dots=#161B22,#3B1530,#6E0F4F,#B10A6F,#E7088A
            dist/snake-light.svg?color_snake=#0969DA&color_dots=#EBF0F7,#F6C3DC,#EE86B8,#E2449A,#B8066E
      - uses: crazy-max/ghaction-github-pages@v4
        with: { target_branch: output, build_dir: dist }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
